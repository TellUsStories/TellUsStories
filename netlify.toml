[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# El formulario antiguo ya no se usa: quien entre por su dirección va al formulario por etapas
[[redirects]]
  from = "/formulario.html"
  to = "/formulario-nuevo.html"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
